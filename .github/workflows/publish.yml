# Publishes n8n-nodes-desearch to npm when a version tag (v*) is pushed.
#
# Auth: npm trusted publishing (OIDC). npmjs.com trusts
# Desearch-ai/n8n-nodes-desearch, workflow file publish.yml. No NPM_TOKEN
# secret is used. Provenance is generated for public packages published
# from a public repository.
#
# Release steps:
#   1. Merge the version bump (package.json "version") to main.
#   2. Push a tag that matches it, for example: git tag v0.1.1 && git push origin v0.1.1
#
# Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14.0.

name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token used by npm trusted publishing and provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm >= 11.5.1
        run: |
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish with provenance
        # RELEASE_MODE lets the n8n-node prerelease guard (prepublishOnly) allow a direct npm publish.
        env:
          RELEASE_MODE: 'true'
        run: npm publish --provenance --access public
