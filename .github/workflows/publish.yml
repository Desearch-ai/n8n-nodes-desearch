# Publishes n8n-nodes-desearch to npm when a version tag (v*) is pushed,
# or when the workflow is run manually for an existing tag.
#
# Auth: npm trusted publishing (OIDC). npmjs.com trusts
# Desearch-ai/n8n-nodes-desearch, workflow file publish.yml. No NPM_TOKEN
# secret is used. Provenance is generated for public packages published
# from a public repository.
#
# Do not set registry-url on actions/setup-node, and do not set
# NODE_AUTH_TOKEN or NPM_TOKEN. A registry auth token — including the
# placeholder setup-node injects when registry-url is set — masks npm's
# OIDC trusted-publishing exchange.
#
# Release steps:
#   1. Merge the version bump (package.json "version") to main.
#   2. Push a tag that matches it, for example: git tag v0.1.1 && git push origin v0.1.1
#      Or run this workflow manually (workflow_dispatch) and pass that tag.
#
# Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14.0.

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.1)'
        required: true
        type: string

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token used by npm trusted publishing and provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        # registry-url is omitted on purpose. It writes a placeholder
        # NODE_AUTH_TOKEN, which masks npm's OIDC trusted-publishing exchange.
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure npm >= 11.5.1
        run: |
          npm install -g npm@^11.5.1
          node --version
          NPM_VERSION="$(npm --version)"
          echo "npm ${NPM_VERSION}"
          LOWEST="$(printf '%s\n' '11.5.1' "${NPM_VERSION}" | sort -V | head -n1)"
          if [ "${LOWEST}" != '11.5.1' ]; then
            echo "npm ${NPM_VERSION} is below 11.5.1"
            exit 1
          fi

      - name: Check tag matches package.json version
        env:
          # On workflow_dispatch, github.ref_name is the branch, not the tag.
          PUBLISH_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${PUBLISH_TAG#v}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=${TAG} package.json=${VERSION}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag ${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish with provenance
        # RELEASE_MODE lets the n8n-node prerelease guard (prepublishOnly) allow a direct npm publish.
        # Clear registry auth so an empty NODE_AUTH_TOKEN/NPM_TOKEN cannot mask the OIDC exchange.
        env:
          RELEASE_MODE: 'true'
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          npm publish --provenance --access public
